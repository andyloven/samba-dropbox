# Default config baked into the image. To change it, bind-mount your own over
# /etc/samba/smb.conf

[global]
   server role = standalone server
   server string = dropbox

   # SMB3 on TCP 445 only. No NetBIOS, no SMB1.
   server min protocol = SMB3
   disable netbios = yes
   smb ports = 445

   # Guest access: any login (or none) becomes the guest account
   map to guest = Bad User
   guest account = nobody

   # No printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   log level = 1

[dropbox]
   path = /share
   comment = LAN drop box
   read only = no
   guest ok = yes
   guest only = yes
   # Every file is written as smb (uid 1000), whoever connects
   force user = smb
   force group = smb
   create mask = 0664
   directory mask = 0775
